[project]
name = "magicsquare-xx"
version = "0.1.0"
description = "4×4 partial magic square validation (ECB + Dual-Track TDD)"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
